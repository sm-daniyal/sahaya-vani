version: "3.9"

services:
  # ── Gnani Evon v3.3 via vLLM ─────────────────────────────────────────────
  vllm-evon:
    image: vllm/vllm-openai:latest
    container_name: sahayavaani-vllm
    runtime: nvidia          # requires NVIDIA Container Toolkit
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model gnani/evon-v3.3
      --host 0.0.0.0
      --port 8000
      --max-model-len 4096
      --dtype bfloat16
      --served-model-name gnani/evon-v3.3
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── SahayaVaani FastAPI Backend ───────────────────────────────────────────
  sahayavaani-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahayavaani-backend
    env_file: ./backend/.env
    environment:
      - VLLM_BASE_URL=http://vllm-evon:8000/v1
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - emr_data:/app/data
    depends_on:
      vllm-evon:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload

volumes:
  huggingface_cache:
  emr_data:
